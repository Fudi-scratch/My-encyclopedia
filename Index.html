<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML・CSS・JS辞典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="site-header">
    <div class="brand">
      <p class="brand-mark">Vol. <span id="volumeCount">1</span></p>
      <h1>HTML・CSS・JS辞典</h1>
      <p class="tagline">タグ・プロパティ・メソッドを、自分の言葉でまとめる用語辞典。</p>
    </div>

    <div class="controls">
      <label class="search-slot" for="searchInput">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input type="search" id="searchInput" placeholder="項目名や本文で検索" autocomplete="off">
      </label>
      <button id="addBtn" class="btn-add" type="button">
        <span class="plus" aria-hidden="true">+</span> 追加
      </button>
      <button id="connBtn" class="btn-conn" type="button">
        <span class="conn-dot" id="connDot" aria-hidden="true"></span>
        <span id="connLabel">GitHub未接続</span>
      </button>
    </div>
  </header>

  <p id="statusBar" class="status-bar" hidden></p>

  <div class="layout">
    <nav class="alpha-rail" id="alphaRail" aria-label="索引タブ"></nav>

    <main class="main" id="main">
      <!-- JSにより home / article / form のいずれかを描画 -->
    </main>
  </div>

  <footer class="site-footer">
    <span id="entryTotal"></span>
    <div class="footer-actions">
      <button id="refreshBtn" class="link-btn" type="button">GitHubから再読み込み</button>
      <button id="exportBtn" class="link-btn" type="button">バックアップを書き出す（JSON）</button>
      <label class="link-btn file-label">
        バックアップを読み込む（JSON）
        <input type="file" id="importInput" accept="application/json" hidden>
      </label>
    </div>
  </footer>

</div>

<div id="toast" class="toast" role="status" hidden></div>

<div id="confirmOverlay" class="overlay" hidden>
  <div class="confirm-box" role="alertdialog" aria-modal="true">
    <p id="confirmMessage">この項目を削除しますか？</p>
    <div class="confirm-actions">
      <button id="confirmCancel" class="btn-ghost" type="button">やめる</button>
      <button id="confirmOk" class="btn-danger" type="button">削除する</button>
    </div>
  </div>
</div>

<div id="settingsOverlay" class="overlay" hidden>
  <div class="settings-box" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">GitHubへの保存設定</h2>
    <p class="settings-lead">
      このデータを保存するGitHubリポジトリと、書き込み用のアクセストークンを設定します。
      入力したトークンはこのブラウザの中だけで使われ、コードやリポジトリには保存されません。
    </p>

    <form id="settingsForm" class="settings-form" novalidate>
      <div class="form-field">
        <label for="ghOwner">GitHubユーザー名（または組織名）</label>
        <input type="text" id="ghOwner" placeholder="例：yamada-taro" autocomplete="off">
      </div>
      <div class="form-field">
        <label for="ghRepo">リポジトリ名</label>
        <input type="text" id="ghRepo" placeholder="例：my-dictionary" autocomplete="off">
      </div>
      <div class="form-field">
        <label for="ghBranch">ブランチ名</label>
        <input type="text" id="ghBranch" placeholder="main" autocomplete="off">
      </div>
      <div class="form-field">
        <label for="ghPath">データファイルのパス</label>
        <input type="text" id="ghPath" placeholder="data/entries.json" autocomplete="off">
      </div>
      <div class="form-field">
        <label for="ghToken">Personal Access Token</label>
        <input type="password" id="ghToken" placeholder="repoのContentsに書き込み権限があるトークン" autocomplete="off">
        <span class="form-hint">Fine-grained PATなら、このリポジトリだけに絞った「Contents: Read and write」権限がおすすめです。</span>
      </div>
      <div class="form-field form-field-checkbox">
        <label class="checkbox-label">
          <input type="checkbox" id="ghRemember">
          このブラウザにトークンを保存する（次回から入力を省略できます）
        </label>
        <span class="form-hint">チェックしない場合、タブを閉じると再入力が必要になります。共有パソコンではチェックしないことをおすすめします。</span>
      </div>

      <p id="settingsError" class="settings-error" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn-primary">保存してつなぐ</button>
        <button type="button" class="btn-ghost" id="settingsCancelBtn">やめる</button>
        <button type="button" class="btn-danger" id="settingsForgetBtn">接続を解除</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
